<style>
        body { font-family: 'Inter', sans-serif; }
        /* Strict 1px stroke economy focus styles */
        input:focus { outline: none; box-shadow: none; }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center p-md">
<!-- Card Container -->
<main class="w-full max-w-[380px] bg-surface-container-lowest border border-outline-variant rounded-lg p-xl flex flex-col">
<!-- Header / Logo Area -->
<header class="flex flex-col items-center mb-xl">
<div class="flex items-center gap-xs mb-sm">
<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">pie_chart</span>
<span class="font-headline-md text-headline-md text-primary tracking-tight">InvestCircle</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Log in to your account</h1>
</header>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="email">Email</label>
<input class="w-full h-10 px-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary transition-colors" id="email" placeholder="name@example.com" required="" type="email">
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-body-sm text-body-sm text-on-surface-variant" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full h-10 px-sm border border-outline-variant rounded bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-primary transition-colors" id="password" placeholder="••••••••" required="" type="password">
</div>
<!-- Submit Button -->
<button class="w-full h-10 mt-sm bg-primary text-on-primary font-body-md text-body-md rounded hover:bg-primary-container transition-colors active:opacity-80" type="submit">
                Log In
            </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md my-lg">
<div class="flex-1 h-px bg-outline-variant opacity-50"></div>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">or</span>
<div class="flex-1 h-px bg-outline-variant opacity-50"></div>
</div>
<!-- Secondary OAuth Button -->
<button class="w-full h-10 bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded hover:bg-surface transition-colors flex items-center justify-center gap-sm active:bg-surface-variant" type="button">
<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Continue with Google
        </button>
</main>
<!-- Footer Link -->
<div class="mt-lg font-body-md text-body-md text-on-surface-variant">
        New here? <a class="text-primary hover:text-primary-container transition-colors" href="#">Sign up</a>
</div>
</body></html>
